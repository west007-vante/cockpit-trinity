<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Ponte — Trinity</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌉</text></svg>">
<style>
:root{
  --laranja:#F97316; --laranja-forte:#EA580C; --laranja-fraco:#FFF3EA;
  --tinta:#18181B; --tinta-media:#52525B; --tinta-fraca:#A1A1AA;
  --papel:#FFFFFF; --fundo:#FAFAF9; --linha:#E7E5E4;
  --verde:#16A34A; --sombra:0 1px 2px rgba(24,24,27,.05), 0 8px 24px -12px rgba(24,24,27,.12);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  background:var(--fundo); color:var(--tinta); -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}

/* ───────── portão ───────── */
#portao{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% -10%,var(--laranja-fraco),var(--fundo) 60%)}
.cartao-portao{width:100%;max-width:390px;background:var(--papel);border:1px solid var(--linha);
  border-radius:20px;padding:34px 30px;box-shadow:var(--sombra)}
.marca{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.02em;font-size:19px}
.pastilha{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(145deg,var(--laranja),var(--laranja-forte));color:#fff;
  box-shadow:0 4px 12px -4px rgba(234,88,12,.6)}
.sub{color:var(--tinta-media);font-size:13.5px;margin:10px 0 24px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--tinta-media);margin:0 0 6px}
.campo{width:100%;padding:11px 13px;border:1px solid var(--linha);border-radius:10px;background:var(--fundo);
  outline:0;transition:border-color .15s,box-shadow .15s;margin-bottom:14px}
.campo:focus{border-color:var(--laranja);box-shadow:0 0 0 3px rgba(249,115,22,.14);background:var(--papel)}
.btn{width:100%;padding:11px;border-radius:10px;font-weight:650;
  background:linear-gradient(145deg,var(--laranja),var(--laranja-forte));color:#fff;
  box-shadow:0 4px 14px -6px rgba(234,88,12,.7);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-fantasma{width:100%;padding:9px;margin-top:9px;border-radius:10px;color:var(--tinta-media);font-size:13.5px;font-weight:550}
.btn-fantasma:hover{background:var(--fundo);color:var(--tinta)}
.aviso{font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none}
.aviso.erro{display:block;background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA}
.aviso.ok{display:block;background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0}

/* ───────── casca ───────── */
#casca{display:none;min-height:100dvh;flex-direction:column}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:13px 22px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--linha)}
.eu{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tinta-media)}
.bolinha{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.sair{font-size:13px;color:var(--tinta-fraca);padding:5px 10px;border-radius:8px}
.sair:hover{background:var(--fundo);color:var(--tinta)}

main{flex:1;display:grid;gap:18px;padding:22px;max-width:1340px;width:100%;margin:0 auto;
  grid-template-columns:1fr 1fr 400px;align-items:start}
@media(max-width:1080px){main{grid-template-columns:1fr 1fr}#chat{grid-column:1/-1}}
@media(max-width:720px){main{grid-template-columns:1fr;padding:14px}}

.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden}
.cabeca{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linha)}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:var(--laranja-fraco);color:var(--laranja-forte);border:1px solid #FDE4CE}
.nome{font-weight:680;letter-spacing:-.01em}
.papel{font-size:12px;color:var(--tinta-fraca)}
.selo{margin-left:auto;font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:99px;
  background:var(--fundo);color:var(--tinta-fraca);border:1px solid var(--linha)}
.selo.vivo{background:#F0FDF4;color:var(--verde);border-color:#BBF7D0}

.corpo{padding:8px 10px;max-height:min(58vh,540px);overflow:auto}
.tarefa{padding:11px 12px;border-radius:10px;margin:3px 0;transition:background .15s}
.tarefa:hover{background:var(--fundo)}
.tarefa.agora{background:linear-gradient(90deg,var(--laranja-fraco),transparent 70%);
  box-shadow:inset 2px 0 0 var(--laranja)}
.titulo{font-size:14px;font-weight:560;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tinta-fraca);margin-top:5px}
.pulso{width:6px;height:6px;border-radius:50%;background:var(--laranja);animation:pulso 1.6s ease-in-out infinite;flex:none}
@keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.check{color:var(--verde);font-weight:700}
.vazio{padding:34px 18px;text-align:center;color:var(--tinta-fraca);font-size:13.5px}

/* ───────── chat ───────── */
#chat{display:flex;flex-direction:column;height:min(78vh,720px)}
#fluxo{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bolha{max-width:82%;padding:9px 13px;border-radius:15px;font-size:14px;line-height:1.5;word-wrap:break-word}
.bolha .quem{font-size:11px;font-weight:650;opacity:.7;margin-bottom:2px}
.deles{align-self:flex-start;background:var(--fundo);border:1px solid var(--linha);border-bottom-left-radius:5px}
.minha{align-self:flex-end;background:linear-gradient(145deg,var(--laranja),var(--laranja-forte));color:#fff;border-bottom-right-radius:5px}
.hora{font-size:10.5px;opacity:.55;margin-top:3px;text-align:right}
.compositor{display:flex;gap:9px;padding:12px;border-top:1px solid var(--linha);background:var(--papel)}
.compositor textarea{flex:1;resize:none;max-height:110px;padding:10px 14px;border:1px solid var(--linha);
  border-radius:20px;background:var(--fundo);outline:0;transition:border-color .15s}
.compositor textarea:focus{border-color:var(--laranja);background:var(--papel)}
.enviar{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;align-self:flex-end;
  background:linear-gradient(145deg,var(--laranja),var(--laranja-forte));color:#fff;font-size:15px}
.enviar[disabled]{opacity:.4;pointer-events:none}

/* ───────── sessões ───────── */
.chip{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--linha);
  color:var(--tinta-media);background:var(--papel);transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--laranja);color:var(--laranja-forte)}
#sessoes{position:fixed;inset:0;z-index:50;display:none;background:rgba(24,24,27,.4);backdrop-filter:blur(5px)}
#sessoes.aberto{display:grid;place-items:center;padding:min(4vw,34px)}
.janela{width:100%;max-width:1180px;height:min(88vh,860px);background:var(--papel);border-radius:16px;
  box-shadow:0 28px 70px -20px rgba(24,24,27,.4);display:flex;flex-direction:column;overflow:hidden}
.barra-busca{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--linha)}
.barra-busca input{flex:1;padding:10px 15px;border:1px solid var(--linha);border-radius:22px;
  background:var(--fundo);outline:0;transition:border-color .15s}
.barra-busca input:focus{border-color:var(--laranja);background:var(--papel)}
.fechar{width:32px;height:32px;flex:none;border-radius:9px;color:var(--tinta-fraca);font-size:16px}
.fechar:hover{background:var(--fundo);color:var(--tinta)}
.duas{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
@media(max-width:820px){.duas{grid-template-columns:1fr}.duas #leitor{display:none}
  .duas.lendo #lista-sessoes{display:none}.duas.lendo #leitor{display:block}}
#lista-sessoes{border-right:1px solid var(--linha);overflow:auto;padding:8px}
.item{padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:3px;transition:background .15s}
.item:hover{background:var(--fundo)}
.item.ativo{background:var(--laranja-fraco);box-shadow:inset 2px 0 0 var(--laranja)}
.item .t{font-size:13.5px;font-weight:560;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:11px;color:var(--tinta-fraca);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap}
.tag{background:var(--fundo);border:1px solid var(--linha);border-radius:5px;padding:1px 5px}
.tag.limpo{background:#F0FDF4;color:var(--verde);border-color:#BBF7D0}
#leitor{overflow:auto;padding:26px 32px;font-size:14.5px;line-height:1.68}
#leitor h1{font-size:21px;margin:0 0 14px;letter-spacing:-.02em}
#leitor h3{font-size:14px;margin:22px 0 7px;color:var(--laranja-forte);letter-spacing:-.01em}
#leitor p{margin:9px 0} #leitor hr{border:0;border-top:1px solid var(--linha);margin:18px 0}
#leitor code{background:var(--fundo);border:1px solid var(--linha);border-radius:5px;padding:1px 5px;
  font-size:12.5px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
#leitor blockquote{border-left:2px solid var(--laranja);background:var(--laranja-fraco);
  padding:8px 14px;margin:11px 0;border-radius:0 8px 8px 0;font-size:13.5px}
#leitor .mask{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;border-radius:5px;
  padding:1px 6px;font-size:12px;font-weight:600}
#leitor strong{font-weight:660}

/* ───────── quem é você ───────── */
#quemsou{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;background:rgba(24,24,27,.35);backdrop-filter:blur(4px)}
#quemsou .cartao-portao{max-width:340px}
.escolha{display:flex;align-items:center;gap:11px;width:100%;padding:12px;border:1px solid var(--linha);
  border-radius:11px;margin-bottom:9px;text-align:left;transition:border-color .15s,background .15s}
.escolha:hover{border-color:var(--laranja);background:var(--laranja-fraco)}
</style>
</head>
<body>

<!-- ═══ PORTÃO ═══ -->
<section id="portao">
  <div class="cartao-portao">
    <div class="marca"><span class="pastilha">🌉</span> A Ponte</div>
    <p class="sub" id="sub-portao">O que você constrói no Claude Code aparece aqui — pro outro ver, ao vivo.</p>
    <div class="aviso" id="recado"></div>
    <form id="form-entrar">
      <label for="email">E-mail</label>
      <input class="campo" type="email" id="email" autocomplete="email" required placeholder="voce@exemplo.com">
      <label for="senha">Senha</label>
      <input class="campo" type="password" id="senha" autocomplete="current-password" required minlength="6" placeholder="••••••••">
      <button class="btn" id="btn-entrar" type="submit">Entrar</button>
      <button class="btn-fantasma" id="btn-trocar" type="button">Primeira vez aqui? Criar minha conta</button>
    </form>
  </div>
</section>

<!-- ═══ QUEM É VOCÊ ═══ -->
<div id="quemsou">
  <div class="cartao-portao">
    <div class="marca"><span class="pastilha">👋</span> Quem é você?</div>
    <p class="sub">Só uma vez — pra seu trabalho aparecer no lugar certo.</p>
    <div id="lista-donos"></div>
  </div>
</div>

<!-- ═══ A PONTE ═══ -->
<div id="casca">
  <header>
    <div class="marca"><span class="pastilha">🌉</span> A Ponte</div>
    <button class="chip" id="btn-sessoes">🔎 Sessões</button>
    <div class="eu"><span class="bolinha"></span><span id="rotulo-eu">—</span>
      <button class="sair" id="btn-sair">sair</button></div>
  </header>
  <main>
    <section class="cartao" id="coluna-steve"></section>
    <section class="cartao" id="coluna-rico"></section>
    <section class="cartao" id="chat">
      <div class="cabeca"><span class="avatar">💬</span>
        <div><div class="nome">Conversa</div><div class="papel">Pyerri e Davi</div></div></div>
      <div id="fluxo"><div class="vazio">Carregando…</div></div>
      <div class="compositor">
        <textarea id="entrada" rows="1" placeholder="Escreve aqui…"></textarea>
        <button class="enviar" id="btn-enviar" disabled>↑</button>
      </div>
    </section>
  </main>
</div>

<!-- ═══ SESSÕES ═══ -->
<div id="sessoes">
  <div class="janela">
    <div class="barra-busca">
      <input id="busca" placeholder="Buscar em tudo que você já construiu…" autocomplete="off">
      <span class="papel" id="contagem"></span>
      <button class="fechar" id="fechar-sessoes">✕</button>
    </div>
    <div class="duas" id="duas">
      <aside id="lista-sessoes"><div class="vazio">Carregando…</div></aside>
      <article id="leitor"><div class="vazio">Escolha uma sessão pra ler por completo.</div></article>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   A PONTE — Pyerri ↔ Davi
   Os dados moram no schema `trinity` do banco Steve. Esta página só
   enxerga o que a pessoa LOGADA pode ver (views security_invoker).
   A chave abaixo é pública de propósito: sozinha ela não lê nada.
   ══════════════════════════════════════════════════════════════ */
const URL_BANCO = 'https://rlrxeegnwjsmxwzoytiz.supabase.co';
const CHAVE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJscnhlZWdud2pzbXh3em95dGl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzOTcxMDEsImV4cCI6MjA4OTk3MzEwMX0.jWsEO2sx5Iu5NxIQt5TXPCKzqsBqRngVcE5aBVFxWgw';
const sb = supabase.createClient(URL_BANCO, CHAVE);

const $ = s => document.querySelector(s);
const PULSO_MS = 3000;          // de quanto em quanto tempo a página se atualiza
const VIVO_MS  = 4 * 60 * 1000; // "fazendo agora" vale por 4 min sem notícia

let eu = null, donos = [], salaId = null, ultimaMsg = 0, relogio = null, modoCadastro = false;

/* ─────────── portão ─────────── */
function recado(txt, tipo){ const el = $('#recado'); el.textContent = txt; el.className = 'aviso ' + (tipo || ''); }

$('#btn-trocar').onclick = () => {
  modoCadastro = !modoCadastro;
  $('#btn-entrar').textContent = modoCadastro ? 'Criar minha conta' : 'Entrar';
  $('#btn-trocar').textContent = modoCadastro ? 'Já tenho conta — entrar' : 'Primeira vez aqui? Criar minha conta';
  $('#senha').autocomplete = modoCadastro ? 'new-password' : 'current-password';
  recado('', '');
};

$('#form-entrar').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#btn-entrar'); btn.disabled = true;
  const email = $('#email').value.trim(), senha = $('#senha').value;
  try {
    if (modoCadastro) {
      const { data, error } = await sb.auth.signUp({ email, password: senha });
      if (error) throw error;
      if (!data.session) { recado('Conta criada. Confirme pelo link que chegou no seu e-mail e volte aqui.', 'ok'); return; }
      await abrir();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) throw error;
      await abrir();
    }
  } catch (err) {
    recado(traduz(err.message), 'erro');
  } finally { btn.disabled = false; }
};

function traduz(m){
  const t = (m || '').toLowerCase();
  if (t.includes('invalid login')) return 'E-mail ou senha não conferem.';
  if (t.includes('email not confirmed')) return 'Falta confirmar seu e-mail — o link está na sua caixa de entrada.';
  if (t.includes('already registered')) return 'Esse e-mail já tem conta. É só entrar.';
  if (t.includes('at least')) return 'A senha precisa de pelo menos 6 caracteres.';
  return m;
}

$('#btn-sair').onclick = async () => { clearInterval(relogio); await sb.auth.signOut(); location.reload(); };

/* ─────────── quem é você ─────────── */
async function perguntarQuemSou(){
  const box = $('#lista-donos'); box.innerHTML = '';
  const livres = donos.filter(d => !d.tomado);
  (livres.length ? livres : donos).forEach(d => {
    const b = document.createElement('button');
    b.className = 'escolha';
    b.innerHTML = `<span class="avatar">${d.name[0]}</span><span><span class="nome">${d.name}</span><br><span class="papel">${d.role || ''}</span></span>`;
    b.onclick = async () => {
      const { error } = await sb.rpc('trinity_sou', { p_owner: d.id });
      if (error) return alert(error.message);
      $('#quemsou').style.display = 'none';
      await abrir();
    };
    box.appendChild(b);
  });
  $('#quemsou').style.display = 'grid';
}

/* ─────────── abrir a ponte ─────────── */
async function abrir(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  const { data: dn } = await sb.from('trinity_owners').select('*').order('id');
  const { data: perfis } = await sb.from('trinity_profiles').select('id,owner,email,nickname');
  donos = (dn || []).map(d => ({ ...d, tomado: (perfis || []).some(p => p.owner === d.id) }));

  const meu = (perfis || []).find(p => p.id === user.id);
  if (!meu || !meu.owner) { $('#portao').style.display = 'none'; return perguntarQuemSou(); }

  eu = { ...meu, nome: (donos.find(d => d.id === meu.owner) || {}).name || meu.nickname };
  $('#portao').style.display = 'none';
  $('#casca').style.display = 'flex';
  $('#rotulo-eu').textContent = eu.nome;

  const { data: sala } = await sb.rpc('trinity_sala');
  salaId = sala;

  await atualizar();
  relogio = setInterval(atualizar, PULSO_MS);
}

/* ─────────── o pulso ─────────── */
async function atualizar(){
  const [{ data: trabalho }, { data: msgs }] = await Promise.all([
    sb.from('trinity_worklog').select('*').order('updated_at', { ascending: false }).limit(60),
    salaId ? sb.from('trinity_messages').select('*').eq('conversation_id', salaId).order('created_at').limit(200)
           : Promise.resolve({ data: [] })
  ]);
  pintarColuna('#coluna-steve', 'steve', trabalho || []);
  pintarColuna('#coluna-rico',  'rico',  trabalho || []);
  pintarChat(msgs || []);
}

const agoraMesmo = t => t.status === 'fazendo' && (Date.now() - new Date(t.updated_at)) < VIVO_MS;

function quando(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'agora há pouco';
  if (s < 3600) return `há ${Math.floor(s/60)} min`;
  if (s < 86400) return `há ${Math.floor(s/3600)} h`;
  return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}

function pintarColuna(alvo, dono, tudo){
  const d = donos.find(x => x.id === dono) || { name: dono, role: '' };
  const meus = tudo.filter(t => t.owner === dono);
  const vivos = meus.filter(agoraMesmo);
  const el = $(alvo);

  el.innerHTML = `
    <div class="cabeca">
      <span class="avatar">${d.name[0]}</span>
      <div><div class="nome">${d.name}${dono === eu.owner ? ' <span class="papel">· você</span>' : ''}</div>
           <div class="papel">${d.role || ''}</div></div>
      <span class="selo ${vivos.length ? 'vivo' : ''}">${vivos.length ? 'trabalhando agora' : 'parado'}</span>
    </div>
    <div class="corpo">${
      meus.length ? meus.slice(0, 30).map(t => {
        const vivo = agoraMesmo(t);
        return `<div class="tarefa ${vivo ? 'agora' : ''}">
          <div class="titulo">${escapar(t.title || 'sem título')}</div>
          <div class="meta">
            ${vivo ? '<span class="pulso"></span>fazendo agora' : '<span class="check">✓</span>' + escapar(t.summary || 'concluída')}
            <span>·</span><span>${quando(t.updated_at)}</span>
          </div></div>`;
      }).join('') : `<div class="vazio">Nada por aqui ainda.<br>Assim que ${d.name} construir algo no Claude&nbsp;Code, aparece.</div>`
    }</div>`;
}

function pintarChat(msgs){
  if (msgs.length === ultimaMsg) return;      // nada novo: não repinta (não rouba o scroll)
  ultimaMsg = msgs.length;
  const fluxo = $('#fluxo');
  const colado = fluxo.scrollHeight - fluxo.scrollTop - fluxo.clientHeight < 90;
  fluxo.innerHTML = msgs.length ? msgs.map(m => {
    const minha = m.sender === eu.owner;
    return `<div class="bolha ${minha ? 'minha' : 'deles'}">
      ${minha ? '' : `<div class="quem">${escapar(m.sender_name || m.sender)}</div>`}
      ${escapar(m.body)}
      <div class="hora">${new Date(m.created_at).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}</div>
    </div>`;
  }).join('') : '<div class="vazio">Nenhuma mensagem ainda.<br>Manda a primeira.</div>';
  if (colado) fluxo.scrollTop = fluxo.scrollHeight;
}

const escapar = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ─────────── mandar mensagem ─────────── */
const entrada = $('#entrada'), botao = $('#btn-enviar');
entrada.addEventListener('input', () => {
  botao.disabled = !entrada.value.trim();
  entrada.style.height = 'auto';
  entrada.style.height = Math.min(entrada.scrollHeight, 110) + 'px';
});
entrada.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); mandar(); }
});
botao.onclick = mandar;

async function mandar(){
  const corpo = entrada.value.trim();
  if (!corpo || !salaId) return;
  entrada.value = ''; entrada.style.height = 'auto'; botao.disabled = true;
  const { error } = await sb.rpc('trinity_send_message', { p_conversation: salaId, p_body: corpo });
  if (error) { alert(error.message); entrada.value = corpo; return; }
  ultimaMsg = -1;           // força repintar
  atualizar();
}

/* ═════════════ SESSÕES — buscar e ler por completo ═════════════ */
const painelSessoes = $('#sessoes'), campoBusca = $('#busca');
let achadas = [], escolhida = null, timerBusca = null;

$('#btn-sessoes').onclick = () => { painelSessoes.classList.add('aberto'); campoBusca.focus(); procurar(); };
$('#fechar-sessoes').onclick = () => painelSessoes.classList.remove('aberto');
painelSessoes.onclick = e => { if (e.target === painelSessoes) painelSessoes.classList.remove('aberto'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') painelSessoes.classList.remove('aberto');
});
campoBusca.oninput = () => { clearTimeout(timerBusca); timerBusca = setTimeout(procurar, 260); };

async function procurar(){
  const termo = campoBusca.value.trim();
  let q = sb.from('trinity_docs')
            .select('session_id,owner,titulo,bytes,mascarados,pedidos,respostas,terminou_em')
            .order('terminou_em', { ascending: false }).limit(60);
  if (termo) q = q.or(`titulo.ilike.%${termo}%,markdown.ilike.%${termo}%`);
  const { data, error } = await q;
  if (error) { $('#lista-sessoes').innerHTML = `<div class="vazio">${escapar(error.message)}</div>`; return; }

  achadas = data || [];
  $('#contagem').textContent = achadas.length ? `${achadas.length} sessão(ões)` : '';
  $('#lista-sessoes').innerHTML = achadas.length ? achadas.map(s => {
    const d = donos.find(x => x.id === s.owner);
    return `<div class="item ${escolhida === s.session_id ? 'ativo' : ''}" data-id="${s.session_id}">
      <div class="t">${escapar(s.titulo || 'sem título')}</div>
      <div class="m">
        <span class="tag">${d ? escapar(d.name) : s.owner}</span>
        <span>${quando(s.terminou_em)}</span>
        <span>${Math.round((s.bytes || 0) / 1024)} KB</span>
        ${s.mascarados ? `<span class="tag">🧽 ${s.mascarados}</span>`
                       : '<span class="tag limpo">sem segredo</span>'}
      </div></div>`;
  }).join('') : `<div class="vazio">${termo ? 'Nada com esse termo.' : 'Nenhuma sessão sincronizada ainda.'}</div>`;

  $('#lista-sessoes').querySelectorAll('.item').forEach(el => {
    el.onclick = () => abrirSessao(el.dataset.id);
  });
}

async function abrirSessao(id){
  escolhida = id;
  $('#duas').classList.add('lendo');
  $('#lista-sessoes').querySelectorAll('.item').forEach(el =>
    el.classList.toggle('ativo', el.dataset.id === id));
  $('#leitor').innerHTML = '<div class="vazio">Abrindo…</div>';
  const { data, error } = await sb.from('trinity_docs').select('markdown').eq('session_id', id).single();
  $('#leitor').innerHTML = error ? `<div class="vazio">${escapar(error.message)}</div>`
                                 : desenharMarkdown(data.markdown || '');
  $('#leitor').scrollTop = 0;
}

/* markdown enxuto — o suficiente pro que a gente gera, sem biblioteca de fora */
function desenharMarkdown(md){
  const linhas = escapar(md).split('\n');
  const saida = [];
  let emBloco = false;
  for (let ln of linhas) {
    if (ln.trim().startsWith('```')) {
      saida.push(emBloco ? '</code></pre>' : '<pre style="background:var(--fundo);border:1px solid var(--linha);border-radius:9px;padding:12px;overflow-x:auto;font-size:12.5px"><code>');
      emBloco = !emBloco; continue;
    }
    if (emBloco) { saida.push(ln + '\n'); continue; }

    ln = ln
      .replace(/‹([A-Z\-]+) mascarad[ao]›/g, '<span class="mask">‹$1 mascarado›</span>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    if (/^---+$/.test(ln.trim()))      saida.push('<hr>');
    else if (ln.startsWith('### '))    saida.push(`<h3>${ln.slice(4)}</h3>`);
    else if (ln.startsWith('## '))     saida.push(`<h3>${ln.slice(3)}</h3>`);
    else if (ln.startsWith('# '))      saida.push(`<h1>${ln.slice(2)}</h1>`);
    else if (ln.startsWith('&gt; '))   saida.push(`<blockquote>${ln.slice(5)}</blockquote>`);
    else if (ln.trim())                saida.push(`<p>${ln}</p>`);
  }
  if (emBloco) saida.push('</code></pre>');
  return saida.join('') || '<div class="vazio">Sessão vazia.</div>';
}

/* ─────────── já estava logado? ─────────── */
sb.auth.getSession().then(({ data: { session } }) => { if (session) abrir(); });
